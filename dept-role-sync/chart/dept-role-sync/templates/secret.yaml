{{- if and (not .Values.existingSecret) (not .Values.vault.enabled) }}
{{- if not .Values.credentials.supersetPassword }}
{{- fail "set existingSecret, credentials.supersetUsername/supersetPassword, or vault.enabled=true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dept-role-sync.fullname" . }}
  labels:
    {{- include "dept-role-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.credentials.deptApiToken }}
  DEPT_API_TOKEN: {{ . | quote }}
  {{- end }}
  SUPERSET_USERNAME: {{ required "credentials.supersetUsername is required" .Values.credentials.supersetUsername | quote }}
  SUPERSET_PASSWORD: {{ .Values.credentials.supersetPassword | quote }}
{{- end }}
