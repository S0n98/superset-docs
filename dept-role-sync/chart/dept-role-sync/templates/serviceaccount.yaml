{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dept-role-sync.serviceAccountName" . }}
  labels:
    {{- include "dept-role-sync.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Only Vault's Kubernetes auth needs the token.
automountServiceAccountToken: {{ .Values.vault.enabled }}
{{- end }}
