# Apply with:
#   kubectl create configmap dept-role-sync-script -n default \
#     --from-file=sync_roles.py=../sync_roles.py --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f cronjob.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dept-role-sync
  namespace: default
type: Opaque
stringData:
  DEPT_API_TOKEN: "dept-api-test-token"        # CHANGE ME for the real API
  SUPERSET_USERNAME: "admin"                    # an account that maps to Superset Admin
  SUPERSET_PASSWORD: "<CHANGE ME>"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dept-role-sync
  namespace: default
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command: ["python", "/scripts/sync_roles.py"]
              env:
                - name: DEPT_API_URL
                  value: "http://192.168.2.100:8091/api/departments"   # mock API; swap for the real one
                - name: SUPERSET_URL
                  value: "http://superset.default.svc.cluster.local:8088"
                - name: SUPERSET_AUTH_PROVIDER
                  value: "ldap"
              envFrom:
                - secretRef:
                    name: dept-role-sync
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
          volumes:
            - name: script
              configMap:
                name: dept-role-sync-script
