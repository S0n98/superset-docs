# Trimmed to only what this repo's README documents (LDAP auth + access model). A
# real deployment's configOverrides may carry other, unrelated entries too
# (e.g. a custom EVENT_LOGGER for audit shipping) -- add those separately,
# they don't interact with anything below.

image:
  repository: docker.io/library/superset-ldap
  tag: "6.0.0"
  pullPolicy: IfNotPresent

bootstrapScript: |
  #!/bin/bash
  if [ ! -f ~/bootstrap ]; then echo "Running Superset bootstrap" > ~/bootstrap; fi

extraSecretEnv:
  SUPERSET_SECRET_KEY: "<CHANGE ME - generate with: openssl rand -base64 42>"

hostAliases:
  - hostnames:
    - trino.local
    ip: 192.168.2.100

ingress:
  enabled: true
  hosts:
  - superset.local
  ingressClassName: nginx
  path: /
  pathType: Prefix

configOverrides:
  enable_ldap: |
    from flask_appbuilder.security.manager import AUTH_LDAP

    AUTH_TYPE = AUTH_LDAP
    AUTH_USER_REGISTRATION = True
    # Every user gets this role at every login, on top of their mapped
    # roles. Keep it the least-privileged functional role: permissions add
    # up across roles, so a broader default (e.g. Gamma) would silently
    # give everyone its rights.
    AUTH_USER_REGISTRATION_ROLE = "DSP_DATA_VIEWER"

    AUTH_LDAP_SERVER = "ldap://192.168.2.100:3890"

    AUTH_LDAP_SEARCH = "dc=example,dc=com"

    AUTH_LDAP_UID_FIELD = "uid"

    AUTH_LDAP_BIND_USER = "uid=admin,ou=people,dc=example,dc=com"
    AUTH_LDAP_BIND_PASSWORD = "<lldap admin password, set via LLDAP_LDAP_USER_PASS>"

    AUTH_LDAP_FIRSTNAME_FIELD = "givenName"
    AUTH_LDAP_LASTNAME_FIELD = "sn"
    AUTH_LDAP_EMAIL_FIELD = "mail"
    # Authorization at login comes from four user attributes plus group
    # membership (see superset-docs ACCESS-RULES.md):
    #   memberOf            -> functional roles (Admin, DSP_*), static mapping
    #   brcd + department   -> "<brcd> - <deptcd> - <deptnm>" role, synced
    #                          from the department API by dept-role-sync;
    #                          grants dashboards (DASHBOARD_RBAC)
    #   area                -> AREA_<area> role -> RLS  area = '<area>'
    #   type                -> TYPE_<type> role -> RLS  data_type = '<type>'
    # Attribute names are configurable below; for OIDC they are claim names.
    AUTH_LDAP_GROUP_FIELD = "memberOf"
    ACCESS_ATTRIBUTES = {"brcd": "brcd", "department": "department", "area": "area", "type": "type"}

    # Keys: memberOf DNs as-is; "area:<value>" / "type:<value>" for the
    # area and type attributes. An unmapped value gives no role, and the
    # deny-by-default RLS filters then hide all rows.
    AUTH_ROLES_MAPPING = {
        # functional roles, from directory groups
        "cn=superset_admins,ou=groups,dc=example,dc=com": ["Admin"],
        "cn=dsp_application_admin,ou=groups,dc=example,dc=com": ["DSP_APPLICATION_ADMIN"],
        "cn=dsp_data_steward,ou=groups,dc=example,dc=com": ["DSP_DATA_STEWARD"],
        "cn=dsp_data_analyst,ou=groups,dc=example,dc=com": ["DSP_DATA_ANALYST"],
        "cn=dsp_data_viewer,ou=groups,dc=example,dc=com": ["DSP_DATA_VIEWER"],
        # row-level security, from the area / type attributes
        "area:HN": ["AREA_HN"],
        "area:HCM": ["AREA_HCM"],
        "type:KHCN": ["TYPE_KHCN"],
        "type:KHDN": ["TYPE_KHDN"],
    }

    AUTH_ROLES_SYNC_AT_LOGIN = True

    import logging as _logging
    from superset.security import SupersetSecurityManager

    class DataAccessSecurityManager(SupersetSecurityManager):
        """Adds attribute-driven roles on top of FAB's group mapping.

        get_roles_from_keys is shared by FAB's LDAP and OAuth login paths;
        an OAuth provider just needs to return access_role_keys(...) as
        "role_keys" from its user-info hook.
        """

        @staticmethod
        def access_role_keys(brcd=None, department=None, area=None, data_type=None):
            keys = []
            if brcd and department:
                keys.append(f"dept:{brcd} - {department}")
            if area:
                keys.append(f"area:{area}")
            if data_type:
                keys.append(f"type:{data_type}")
            return keys

        def get_roles_from_keys(self, role_keys):
            # Static AUTH_ROLES_MAPPING (memberOf DNs, area:*, type:*).
            roles = super().get_roles_from_keys(role_keys)
            # Department role: names change on rename, so match by the
            # stable "<brcd> - <deptcd> - " prefix instead of a mapping.
            for key in role_keys:
                if not key.startswith("dept:"):
                    continue
                prefix = key[len("dept:"):] + " - "
                matches = (
                    self.session.query(self.role_model)
                    .filter(self.role_model.name.startswith(prefix, autoescape=True))
                    .all()
                )
                if len(matches) == 1:
                    roles.add(matches[0])
                elif matches:
                    _logging.getLogger(__name__).warning(
                        "%r matches several roles %s, assigning none",
                        prefix, [r.name for r in matches],
                    )
            return roles

        def _search_ldap(self, ldap, con, username):
            # FAB only requests name/email/group-field attributes. Ask for
            # the access attributes too, by extending the attribute list of
            # FAB's own search call.
            wanted = list(ACCESS_ATTRIBUTES.values())
            original = con.search_s

            def search_s(base, scope, filterstr=None, attrlist=None, *args, **kwargs):
                if attrlist is not None:
                    attrlist = list(attrlist) + [a for a in wanted if a not in attrlist]
                return original(base, scope, filterstr, attrlist, *args, **kwargs)

            con.search_s = search_s
            try:
                return super()._search_ldap(ldap, con, username)
            finally:
                con.search_s = original

        def _ldap_calculate_user_roles(self, user_attributes):
            roles = set(super()._ldap_calculate_user_roles(user_attributes))
            attrs = {k.lower(): v for k, v in user_attributes.items()}

            def get(name):
                return self.ldap_extract(attrs, ACCESS_ATTRIBUTES[name].lower(), "").strip()

            keys = self.access_role_keys(get("brcd"), get("department"), get("area"), get("type"))
            roles.update(self.get_roles_from_keys(keys))
            return list(roles)

    CUSTOM_SECURITY_MANAGER = DataAccessSecurityManager

    # Lets admins grant a dashboard to roles (dashboard Properties -> Roles).
    FEATURE_FLAGS = {**globals().get("FEATURE_FLAGS", {}), "DASHBOARD_RBAC": True}

    RECAPTCHA_PUBLIC_KEY = None
    import logging

    logging.basicConfig(level=logging.DEBUG)

    LOG_LEVEL = "DEBUG"

    logging.getLogger("flask_appbuilder").setLevel(logging.DEBUG)
    logging.getLogger("flask_appbuilder.security").setLevel(logging.DEBUG)
    logging.getLogger("ldap3").setLevel(logging.DEBUG)
    logging.getLogger("superset").setLevel(logging.DEBUG)

