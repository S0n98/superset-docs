init:
  enabled: false
  loadExamples: false
  createAdmin: true
  adminUser:
    username: admin
    firstname: Superset
    lastname: Admin
    email: admin@superset.com
    password: "<CHANGE ME>"

supersetNode:
  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    timeoutSeconds: 1
    failureThreshold: 180
    periodSeconds: 5
    successThreshold: 1
  connections:
    redis_host: "superset-redis-headless"
    redis_port: "6379"
    db_host: "superset-postgresql"
    db_port: "5432"
    db_user: superset
    db_pass: "<CHANGE ME - must match postgresql.auth.password below>"
    db_name: superset
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

service:
  type: ClusterIP
  port: 8088

postgresql:
  enabled: true
  auth:
    username: superset
    password: "<CHANGE ME - must match supersetNode.connections.db_pass above>"
    database: superset

redis:
  enabled: true
