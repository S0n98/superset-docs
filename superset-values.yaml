# Trimmed to only what this repo's README documents (LDAP auth + RLS). A
# real deployment's configOverrides may carry other, unrelated entries too
# (e.g. a custom EVENT_LOGGER for audit shipping) -- add those separately,
# they don't interact with anything below.

image:
  repository: docker.io/library/superset-ldap
  tag: "6.0.0"
  pullPolicy: IfNotPresent

bootstrapScript: |
  #!/bin/bash
  if [ ! -f ~/bootstrap ]; then echo "Running Superset bootstrap" > ~/bootstrap; fi

extraSecretEnv:
  SUPERSET_SECRET_KEY: "<CHANGE ME - generate with: openssl rand -base64 42>"

hostAliases:
  - hostnames:
    - trino.local
    ip: 192.168.2.100

ingress:
  enabled: true
  hosts:
  - superset.local
  ingressClassName: nginx
  path: /
  pathType: Prefix

configOverrides:
  enable_ldap: |
    from flask_appbuilder.security.manager import AUTH_LDAP

    AUTH_TYPE = AUTH_LDAP
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Gamma"

    AUTH_LDAP_SERVER = "ldap://192.168.2.100:3890"

    AUTH_LDAP_SEARCH = "dc=example,dc=com"

    AUTH_LDAP_UID_FIELD = "uid"

    AUTH_LDAP_BIND_USER = "uid=admin,ou=people,dc=example,dc=com"
    AUTH_LDAP_BIND_PASSWORD = "<lldap admin password, set via LLDAP_LDAP_USER_PASS>"

    AUTH_LDAP_FIRSTNAME_FIELD = "givenName"
    AUTH_LDAP_LASTNAME_FIELD = "sn"
    AUTH_LDAP_EMAIL_FIELD = "mail"

    # Production note: authorization here is NOT derived from AD/LDAP group
    # membership (no memberOf lookup). It comes from a plain attribute
    # already present on the user's own directory entry -- "department" in
    # this deployment, but the mechanism works for any single-valued
    # attribute your AD sends back on bind (employeeType, businessCategory,
    # a custom extensionAttribute, etc). AUTH_LDAP_GROUP_FIELD is not
    # actually group-specific despite the name -- FAB treats whatever
    # attribute it names as a list of "role keys" and looks each one up in
    # AUTH_ROLES_MAPPING below, regardless of whether that attribute is a
    # real LDAP group reference. See README.md Part A's "Alternative"
    # callout for the group-membership variant of this same config.
    AUTH_ROLES_MAPPING = {
        "HO": ["Admin"],
        "HN": ["KHCN", "Region_HN"],
        "HCM": ["KHCN", "Region_HCM"],
    }

    AUTH_LDAP_GROUP_FIELD = "department"

    AUTH_ROLES_SYNC_AT_LOGIN = True

    RECAPTCHA_PUBLIC_KEY = None
    import logging

    logging.basicConfig(level=logging.DEBUG)

    LOG_LEVEL = "DEBUG"

    logging.getLogger("flask_appbuilder").setLevel(logging.DEBUG)
    logging.getLogger("flask_appbuilder.security").setLevel(logging.DEBUG)
    logging.getLogger("ldap3").setLevel(logging.DEBUG)
    logging.getLogger("superset").setLevel(logging.DEBUG)

extraConfigs: {}
